[package]
name = "hajiz"
version = "1.0.0"
edition = "2024"
description = "Secure application sandboxing system in Rust"
authors = ["Ahmad Swedan <swedam324@gmail.com>"]
repository = "https://github.com/hag19/hajiiz"
license = "MIT OR Apache-2.0"

[features]
default = ["ebpf"]
ebpf = ["dep:aya"]

[dependencies]
thiserror = "1.0"
nix     = { version = "0.29", features = ["signal", "process", "sched", "mount", "socket", "uio"] }
libseccomp = "0.3"
clap = { version = "4.6.0", features = ["derive"] }
toml = "1.0.7"
serde = { version = "1.0.228", features = ["derive"] }
aya = { version = "0.13", optional = true }

[dev-dependencies]
